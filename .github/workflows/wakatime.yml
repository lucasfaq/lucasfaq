name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # Runs at every 12AM UTC
    - cron: "0 0 * * *"

jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
    steps:
      - name: Update coding activity
        if: ${{ env.WAKATIME_API_KEY != '' }}
        uses: athul/waka-readme@v0.3.1
        with:
          WAKATIME_API_KEY: ${{ env.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SHOW_TIME: false
